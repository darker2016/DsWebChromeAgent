<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body {
      width: 440px;
      height: 280px;
      overflow: hidden;
      background: linear-gradient(135deg, #182859 0%, #0F172A 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      color: #fff;
      position: relative;
    }
    .glow-circle {
      position: absolute;
      top: -40px;
      right: -40px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(79, 117, 254, 0.45) 0%, rgba(36, 69, 232, 0) 70%);
      border-radius: 50%;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      color: #93C5FD;
      width: fit-content;
      backdrop-filter: blur(8px);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
    }
    .icon-img {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
    .title-group h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(90deg, #FFFFFF 0%, #DBEAFE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .title-group p {
      font-size: 12px;
      color: #94A3B8;
      margin-top: 3px;
    }
    .features {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .tag {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(96, 165, 250, 0.3);
      color: #BFDBFE;
      font-size: 11px;
      padding: 5px 9px;
      border-radius: 6px;
      font-weight: 500;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
      font-size: 11px;
      color: #64748B;
    }
    .platforms {
      color: #38BDF8;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="glow-circle"></div>
  <div>
    <div class="badge">✨ AI Web Chat Supercharger</div>
    <div class="header">
      <img src="icon-300.png" class="icon-img" alt="Logo">
      <div class="title-group">
        <h1>Deepseek Web Agent</h1>
        <p>Turn web chat into multi-agent collaborative teams</p>
      </div>
    </div>
  </div>

  <div class="features">
    <div class="tag">👥 44 Expert Teams</div>
    <div class="tag">🎯 54 Skills</div>
    <div class="tag">⚡ Zero API Cost</div>
  </div>

  <div class="footer">
    <span>DeepSeek · ChatGPT · Kimi · Doubao · Gemini</span>
    <span class="platforms">1-Click Inject</span>
  </div>
</body>
</html>
