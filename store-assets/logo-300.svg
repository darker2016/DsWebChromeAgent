<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F75FE" />
      <stop offset="100%" stop-color="#2445E8" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#8BB2FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2445E8" stop-opacity="0" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1b6e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with rounded rectangle -->
  <rect width="300" height="300" rx="66" fill="url(#bgGrad)" />
  <rect width="300" height="300" rx="66" fill="url(#glowGrad)" />

  <!-- Connecting orbits/lines between center and agents -->
  <g stroke="#E0EFFF" stroke-width="5" stroke-linecap="round" opacity="0.65">
    <line x1="150" y1="150" x2="82" y2="82" />
    <line x1="150" y1="150" x2="218" y2="82" />
    <line x1="150" y1="150" x2="82" y2="218" />
    <line x1="150" y1="150" x2="218" y2="218" />
  </g>

  <!-- Satellite Agent Nodes -->
  <g filter="url(#dropShadow)">
    <circle cx="82" cy="82" r="14" fill="#C5DEFF" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="218" cy="82" r="14" fill="#C5DEFF" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="82" cy="218" r="14" fill="#C5DEFF" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="218" cy="218" r="14" fill="#C5DEFF" stroke="#FFFFFF" stroke-width="4" />
  </g>

  <!-- Central Multi-Agent Sparkle Star -->
  <g filter="url(#dropShadow)">
    <path d="M 150 62 
             Q 150 135 77 150 
             Q 150 165 150 238 
             Q 150 165 223 150 
             Q 150 135 150 62 Z" 
          fill="#FFFFFF" />
    <!-- Secondary diagonal mini points -->
    <path d="M 150 102 
             Q 150 142 110 150 
             Q 150 158 150 198 
             Q 150 158 190 150 
             Q 150 142 150 102 Z" 
          fill="#E6EFFF" />
    <!-- Core Center Ring -->
    <circle cx="150" cy="150" r="16" fill="#294CEE" stroke="#FFFFFF" stroke-width="5" />
    <circle cx="150" cy="150" r="5" fill="#FFFFFF" />
  </g>
</svg>
