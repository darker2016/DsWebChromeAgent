<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
  <title>Deepseek Web Agent</title>
</head>
<body>
  <div class="popup">
    <header>
      <h1>Deepseek Web Agent</h1>
      <span class="version" id="version">-</span>
    </header>
    <div class="counts">
      <div class="count">
        <b id="count-group">-</b>
        <span>专家团</span>
      </div>
      <div class="count">
        <b id="count-single">-</b>
        <span>单体技能</span>
      </div>
    </div>
    <div class="site">
      <div class="site-host" id="current-host">-</div>
      <div class="site-status" id="site-status">-</div>
      <button class="btn btn-secondary" id="enable-site" type="button" hidden>在此页面启用插件</button>
    </div>
    <p class="hint">
      在支持的 AI 对话页右下角点「技能」按钮，选择技能注入输入框；未内置适配的页面可在上方手动启用（通用富文本框模式）。
    </p>
    <button class="btn" id="open-options" type="button">打开设置（含上传技能）</button>
  </div>
  <script src="../shared/site-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
